name: Pull Request Quality Gates

on:
  pull_request:

env:
  GLOO_AI_CLIENT_ID: test-gloo-ai-client-id
  GLOO_AI_CLIENT_SECRET: test-gloo-ai-client-secret

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv install --deploy --ignore-pipfile

      - name: Format check
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv install --deploy --ignore-pipfile

      - name: Run tests
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv run test

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv install --deploy --ignore-pipfile

      - name: Run coverage tests
        env:
          PIPENV_VENV_IN_PROJECT: 1
        run: pipenv run test:coverage
