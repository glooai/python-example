name: Pull Request Quality Gates

on:
  pull_request:

env:
  GLOO_AI_CLIENT_ID: ${{ secrets.GLOO_AI_CLIENT_ID || 'demo-gloo-ai-client-id' }}
  GLOO_AI_CLIENT_SECRET: ${{ secrets.GLOO_AI_CLIENT_SECRET || 'demo-gloo-ai-client-secret' }}

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv install --deploy --ignore-pipfile

      - name: Format check
        run: pipenv run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv install --deploy --ignore-pipfile --dev

      - name: Run tests
        run: pipenv run test

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv install --deploy --ignore-pipfile --dev

      - name: Run coverage tests
        run: pipenv run test:coverage
